<header class="hm-hero">
  <img
    *ngFor="let film of films; let i = index"
    class="dv-hero-bg"
    [class.on]="i === index % films.length"
    [src]="imageUrl(film.backdrop_path, 'w1280')"
    alt=""
  />
  <div class="dv-hero-shade"></div>
  <div class="dv-hero-inner">
    <div class="hm-copy">
      <p class="eyebrow">Social movie tracker</p>
      <h1>Binge</h1>
      <p class="hm-text">Gardez un œil sur les films que vous avez vus, ceux que vous voulez lancer ensuite, et ceux que vos amis recommandent.</p>
      <div class="dv-hero-actions">
        <a routerLink="/films" class="dv-btn dv-btn-main"><i class="fa-solid fa-film"></i> Explorer le catalogue</a>
        <button type="button" class="dv-btn" (click)="scrollTo('aucinema')"><i class="fa-solid fa-ticket"></i> À l'affiche</button>
        <a *ngIf="(isLoggedIn$ | async) === false" routerLink="/register" class="dv-btn"><i class="fa-solid fa-user-plus"></i> Créer un compte</a>
      </div>
    </div>
    <div class="hm-side">
      <a *ngFor="let film of movie ? [movie] : []; trackBy: trackById" [routerLink]="['/film', film.id]" class="hm-featured">
        {{ film.title }}<ng-container *ngIf="film.release_date"> ({{ film.release_date | date : "yyyy" }})</ng-container>
      </a>
      <div class="dv-dots" *ngIf="films.length > 1">
        <button
          *ngFor="let film of films; let i = index"
          type="button"
          [class.on]="i === index % films.length"
          [attr.aria-label]="'Afficher ' + film.title"
          (click)="pick(i)"
        ></button>
      </div>
      <button class="hm-down" type="button" (click)="scrollTo('aucinema')" aria-label="Descendre">
        <i class="fas fa-arrow-down"></i>
      </button>
    </div>
  </div>
</header>
