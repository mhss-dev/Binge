<section id="aucinema" class="hm-section app-shell text-white">
  <div class="hm-head">
    <div>
      <p class="eyebrow">Explorer maintenant</p>
      <h2>{{ title }}</h2>
      <p class="hm-caption" *ngIf="minDate && maxDate && currentTab !== 'toprated'">
        Du {{ minDate | date : "dd/MM" }} au {{ maxDate | date : "dd/MM/yyyy" }}
      </p>
    </div>
    <a *ngIf="currentTab === 'toprated'" routerLink="/films/toprated" class="dv-link">Voir plus</a>
  </div>

  <div *ngIf="error" class="mb-error">{{ error }}</div>

  <div class="hm-controls">
    <div class="dv-seg" role="group" aria-label="Catégorie">
      <button type="button" *ngFor="let tab of tabOrder" [class.on]="currentTab === tab" (click)="selectTab(tab)">{{ tabLabel(tab) }}</button>
    </div>
    <div class="dv-seg" *ngIf="showRegionSelector()" role="group" aria-label="Pays">
      <button type="button" *ngFor="let region of regions" [class.on]="selectedRegion === region.value" (click)="setRegion(region.value)">{{ region.label }}</button>
    </div>
  </div>

  <div class="dv-grid">
    <article *ngFor="let movie of getActiveMovies(); trackBy: trackByMovieId" class="dv-card">
      <a [routerLink]="['/film', movie?.id]" class="dv-poster" [attr.title]="movie?.title">
        <img loading="lazy" [src]="imageUrl(movie?.poster_path)" alt="{{ movie?.title || 'Inconnu' }}" />
        <div class="dv-info">
          <strong *ngIf="!movie?.poster_path">{{ movie?.title || "Titre inconnu" }}</strong>
          <span>
            <ng-container *ngIf="movie?.release_date || movie?.first_air_date">{{ (movie?.release_date || movie?.first_air_date) | date : "yyyy" }}</ng-container>
            <ng-container *ngIf="movie?.vote_average"> · ★ {{ movie?.vote_average | number : "1.0-1" }}</ng-container>
          </span>
        </div>
      </a>
    </article>
  </div>

  <button *ngIf="isButtonVisible()" class="floating-action" (click)="scrollToTop()" aria-label="Retour en haut">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</section>
