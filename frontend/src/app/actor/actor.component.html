<section class="person-page app-shell text-white">
  <div class="person-hero glass-panel" *ngIf="actor">
    <img
      class="person-portrait"
      [src]="
        actor.profile_path
          ? 'https://image.tmdb.org/t/p/w500/' + actor.profile_path
          : 'https://m.media-amazon.com/images/G/01/imdbpro/help/outline._CB1537462849_.png'
      "
      [alt]="actor.name || 'Inconnu'"
    />

    <div class="person-copy">
      <p class="eyebrow" *ngIf="roleLabel()">{{ roleLabel() }}</p>
      <h1>{{ actor.name || "Inconnu" }}</h1>

      <p class="person-facts" *ngIf="lifeFacts().length">
        <span *ngFor="let fact of lifeFacts()">{{ fact }}</span>
      </p>

      <dl class="person-stats" *ngIf="credits.length">
        <div *ngIf="countOf('movie')">
          <dt>{{ countOf("movie") }}</dt>
          <dd>film{{ countOf("movie") > 1 ? "s" : "" }}</dd>
        </div>
        <div *ngIf="countOf('tv')">
          <dt>{{ countOf("tv") }}</dt>
          <dd>série{{ countOf("tv") > 1 ? "s" : "" }}</dd>
        </div>
      </dl>

      <ng-container *ngIf="actor.biography; else noBiography">
        <p class="person-bio" [class.open]="bioExpanded">{{ actor.biography }}</p>
        <button *ngIf="actor.biography.length > 420" type="button" class="dv-link" (click)="bioExpanded = !bioExpanded">
          {{ bioExpanded ? "Voir moins" : "Lire plus" }}
        </button>
      </ng-container>
      <ng-template #noBiography>
        <p class="person-bio empty-bio">Aucune biographie disponible pour le moment.</p>
      </ng-template>
    </div>
  </div>

  <section class="filmography-section" *ngIf="credits.length">
    <div class="section-heading filmography-heading">
      <div>
        <p class="eyebrow">À parcourir</p>
        <h2>Filmographie</h2>
      </div>
      <div class="dv-seg" role="group" aria-label="Afficher" *ngIf="hasBothKinds()">
        <button type="button" *ngFor="let option of filterOptions" [class.on]="creditFilter === option.value" (click)="setFilter(option.value)">{{ option.label }}</button>
      </div>
    </div>

    <div class="filmography-grid">
      <article
        *ngFor="let movie of shownCredits; trackBy: trackByCredit"
        class="filmography-card poster-card"
      >
        <a [routerLink]="creditLink(movie)" class="poster-link" [attr.title]="movie?.title">
          <img
            [src]="
              movie?.poster_path
                ? 'https://image.tmdb.org/t/p/w500/' + movie?.poster_path
                : 'https://placehold.co/500x750?text=Aucun+poster+disponible'
            "
            alt="{{ movie?.title || 'Inconnu' }}"
          />
        </a>
      </article>
    </div>
  </section>

</section>
