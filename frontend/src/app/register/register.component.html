<div class="au-page d-flex flex-column min-vh-100">
  <app-poster-wall></app-poster-wall>
  <div class="container my-auto au-front">
    <div class="row justify-content-center align-items-center">
      <div class="col-lg-5 col-md-8">
        <div class="au-card">
          <div class="text-center mb-4">
            <p class="eyebrow">Bienvenue</p>
            <h2 class="fw-bold">Inscription</h2>
            <p class="au-sub">Retrouvez vos films, favoris et watchlist en un clic !</p>
            <div *ngIf="registerMessage" class="alert {{ alertType }} mt-3" role="alert">
              {{ registerMessage }}
            </div>
          </div>
          <form (ngSubmit)="onRegister()">
            <div class="mb-3">
              <label for="username" class="form-label">Nom de compte :</label>
              <input type="text" id="username" class="form-control rounded-pill" [(ngModel)]="username" name="username" required placeholder="Votre nom de compte">
            </div>

            <div class="mb-3 position-relative">
              <label for="password" class="form-label">Mot de passe :</label>
              <div class="input-group">
                <input [type]="passwordType" id="password" class="form-control rounded-pill" [(ngModel)]="password" name="password" required placeholder="Votre mot de passe">
                <button type="button" class="btn toggle-password" (click)="togglePassword()" aria-label="Afficher ou masquer le mot de passe">
                  <i class="fa" [ngClass]="passwordType === 'password' ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label for="nickname" class="form-label">Pseudo :</label>
              <input type="text" id="nickname" class="form-control rounded-pill" [(ngModel)]="nickname" name="nickname" required placeholder="Votre pseudo">
            </div>

            <button type="submit" class="btn au-submit w-100 rounded-pill py-2 mt-3">S'inscrire</button>
            <div class="text-center mt-3">
              <a class="au-link" href="/login">Vous avez déjà un compte ?</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
